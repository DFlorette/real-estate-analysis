name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # The suite exercises src/ only, which needs the data and geocoding
          # stack. Pulling the full requirements.txt would build hdbscan from
          # source for no benefit here. Versions stay pinned to requirements.txt.
          grep -E '^(pandas|numpy|pyarrow|requests|ratelimit|pytest)==' requirements.txt > ci-requirements.txt
          cat ci-requirements.txt
          pip install -r ci-requirements.txt ruff

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -v
